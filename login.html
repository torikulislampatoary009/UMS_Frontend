<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>University Management System — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css" />
  <style>
    body {
      display: flex;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(var(--paper), var(--paper)) padding-box,
        var(--paper);
    }
    .auth-card {
      width: 360px;
      background: var(--paper-raised);
      border: 1px solid var(--line);
      padding: 2.4rem 2.2rem 2rem;
    }
    .auth-mark {
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: var(--ink);
      margin-bottom: 0.15rem;
    }
    .auth-mark span {
      display: block;
      font-family: var(--font-body);
      font-size: 0.72rem;
      color: var(--gold);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 0.3rem;
    }
    .auth-sub {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin: 0.6rem 0 1.6rem;
      padding-bottom: 1.4rem;
      border-bottom: 1px solid var(--line);
    }
    .auth-card button[type="submit"] { width: 100%; background: var(--ink); }
    .auth-card button[type="submit"]:hover { background: var(--ink-soft); }
    .auth-footer { text-align: center; margin-top: 1.4rem; font-size: 0.82rem; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-mark">University Management System<span>Registrar's Office</span></div>
    <p class="auth-sub">Sign in to access student, faculty, and course records.</p>

    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username" />
      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password" />
      <button type="submit" id="loginBtn">Sign In</button>
    </form>

    <p class="auth-footer"><a href="register.html">Create a new account (admin)</a></p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
