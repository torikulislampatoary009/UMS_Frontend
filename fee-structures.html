<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UMS - Fee Structure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <div class="content-inner">
    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>

    <form id="addForm" class="inline-form">
      <div>
        <label for="newProgram">Program</label>
        <select id="newProgram" required></select>
      </div>
      <div>
        <label for="newSemester">Semester</label>
        <select id="newSemester" required></select>
      </div>
      <div>
        <label for="newFeeType">Fee Type</label>
        <select id="newFeeType" required>
          <option value="tuition">Tuition</option>
          <option value="lab">Lab</option>
          <option value="library">Library</option>
          <option value="hostel">Hostel</option>
          <option value="registration">Registration</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div>
        <label for="newAmount">Amount</label>
        <input type="number" id="newAmount" min="0.01" step="0.01" required />
      </div>
      <button type="submit" style="width:auto; padding:0.6rem 1rem;">Add Fee Line</button>
    </form>
    <p style="font-size:0.8rem; color:var(--text-muted);">
      These lines are what "Generate Invoice" sums together for a student in a given program and semester.
    </p>

    <table id="feeTable">
      <thead><tr><th>Program</th><th>Semester</th><th>Fee Type</th><th>Amount</th><th>Actions</th></tr></thead>
      <tbody id="feeTableBody"></tbody>
    </table>
  </div>

  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/fee-structures.js"></script>
</body>
</html>
