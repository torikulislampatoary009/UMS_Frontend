<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UMS - Forgot Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css" />
  <style>
    body { display: flex; min-height: 100vh; align-items: center; justify-content: center; }
    .auth-card { width: 360px; background: var(--paper-raised); border: 1px solid var(--line); padding: 2.4rem 2.2rem 2rem; }
    .auth-mark { font-family: var(--font-display); font-size: 1.15rem; color: var(--ink); margin-bottom: 0.6rem; }
    .auth-sub { font-size: 0.85rem; color: var(--text-muted); margin: 0 0 1.4rem; }
    .auth-card button[type="submit"] { width: 100%; }
    .auth-footer { text-align: center; margin-top: 1.2rem; font-size: 0.82rem; }
    @media (max-width: 480px) { .auth-card { width: 90%; padding: 1.8rem 1.4rem; } }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-mark">Reset Your Password</div>
    <p class="auth-sub">Enter the email on your account. If it matches a record, we'll issue a reset link.</p>

    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>

    <form id="forgotForm">
      <label for="email">Email</label>
      <input type="email" id="email" required />
      <button type="submit" id="submitBtn">Send Reset Link</button>
    </form>

    <p class="auth-footer"><a href="login.html">Back to sign in</a></p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/forgot-password.js"></script>
</body>
</html>
