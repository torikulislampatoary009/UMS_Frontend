<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UMS - Semesters</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="card card-wide">
    <nav class="topnav">
      <a href="login.html">Login</a>
      <a href="register.html">Create User</a>
      <a href="departments.html">Departments</a>
      <a href="programs.html">Programs</a>
      <a href="courses.html">Courses</a>
      <a href="faculty.html">Faculty</a>
      <a href="students.html">Students</a>
      <a href="semesters.html">Semesters</a>
      <a href="sections.html">Sections</a>
    </nav>

    <h1>Semesters</h1>
    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>

    <form id="addForm" class="inline-form">
      <div>
        <label for="newName">Name</label>
        <input type="text" id="newName" placeholder="e.g. Fall 2026" required />
      </div>
      <div>
        <label for="newStart">Start Date</label>
        <input type="date" id="newStart" required />
      </div>
      <div>
        <label for="newEnd">End Date</label>
        <input type="date" id="newEnd" required />
      </div>
      <button type="submit" style="width:auto; padding:0.6rem 1rem;">Add</button>
    </form>

    <table id="semesterTable">
      <thead>
        <tr><th>ID</th><th>Name</th><th>Start</th><th>End</th><th>Current?</th><th>Actions</th></tr>
      </thead>
      <tbody id="semesterTableBody"></tbody>
    </table>
  </div>

  <script src="js/api.js"></script>
  <script src="js/semesters.js"></script>
</body>
</html>
