<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UMS - Attendance</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <div class="content-inner">
<div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>

    <form id="filterForm" class="inline-form">
      <div>
        <label for="sectionSelect">Section</label>
        <select id="sectionSelect" required></select>
      </div>
      <div>
        <label for="dateInput">Date</label>
        <input type="date" id="dateInput" required />
      </div>
      <button type="submit" style="width:auto; padding:0.6rem 1rem;">Load Roster</button>
    </form>

    <table id="rosterTable">
      <thead>
        <tr><th>Student</th><th>Status</th><th>Actions</th></tr>
      </thead>
      <tbody id="rosterTableBody"></tbody>
    </table>

  </div>

  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/attendance.js"></script>
</body>
</html>
