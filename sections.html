<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UMS - Course Sections</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <div class="content-inner">
<div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>

    <form id="addForm" class="inline-form" style="flex-wrap: wrap;">
      <div>
        <label for="newCourse">Course</label>
        <select id="newCourse" required></select>
      </div>
      <div>
        <label for="newFaculty">Faculty</label>
        <select id="newFaculty" required></select>
      </div>
      <div>
        <label for="newSemester">Semester</label>
        <select id="newSemester" required></select>
      </div>
      <div>
        <label for="newSectionName">Section</label>
        <input type="text" id="newSectionName" placeholder="A" required style="width:70px;" />
      </div>
      <div>
        <label for="newRoom">Room</label>
        <input type="text" id="newRoom" placeholder="Room 204" />
      </div>
      <div>
        <label for="newCapacity">Capacity</label>
        <input type="number" id="newCapacity" min="1" max="500" placeholder="40" style="width:80px;" />
      </div>
      <button type="submit" style="width:auto; padding:0.6rem 1rem;">Add</button>
    </form>

    <table id="sectionTable">
      <thead>
        <tr><th>ID</th><th>Course</th><th>Faculty</th><th>Semester</th><th>Section</th><th>Room</th><th>Cap.</th><th>Actions</th></tr>
      </thead>
      <tbody id="sectionTableBody"></tbody>
    </table>

  </div>

  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/sections.js"></script>
</body>
</html>
