<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UMS - Create User</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <div class="content-inner" style="max-width: 420px;">
    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>

    <form id="registerForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" required />

      <label for="email">Email</label>
      <input type="email" id="email" required />

      <label for="password">Temporary Password</label>
      <input type="password" id="password" required minlength="8" />

      <label for="role">Role</label>
      <select id="role" required>
        <option value="">-- select role --</option>
        <option value="faculty">Faculty</option>
        <option value="student">Student</option>
        <option value="admin">Admin</option>
      </select>

      <button type="submit" id="registerBtn" class="btn-gold">Create Account</button>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
