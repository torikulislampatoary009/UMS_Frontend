<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UMS - Courses</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <div class="content-inner">
<div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>

    <form id="addForm" class="inline-form">
      <div>
        <label for="newCode">Code</label>
        <input type="text" id="newCode" required />
      </div>
      <div>
        <label for="newTitle">Title</label>
        <input type="text" id="newTitle" required />
      </div>
      <div>
        <label for="newCredits">Credits</label>
        <input type="number" id="newCredits" step="0.5" min="0.5" max="12" required />
      </div>
      <div>
        <label for="newDept">Department</label>
        <select id="newDept" required></select>
      </div>
      <button type="submit" style="width:auto; padding:0.6rem 1rem;">Add</button>
    </form>

    <table id="courseTable">
      <thead>
        <tr><th>ID</th><th>Code</th><th>Title</th><th>Credits</th><th>Department</th><th>Actions</th></tr>
      </thead>
      <tbody id="courseTableBody"></tbody>
    </table>

  </div>

  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/courses.js"></script>
</body>
</html>
