<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UMS - Departments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <div class="content-inner">
<div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>

    <form id="addForm" class="inline-form">
      <div>
        <label for="newName">Name</label>
        <input type="text" id="newName" required />
      </div>
      <div>
        <label for="newCode">Code</label>
        <input type="text" id="newCode" required />
      </div>
      <button type="submit" style="width:auto; padding:0.6rem 1rem;">Add</button>
    </form>

    <table id="deptTable">
      <thead>
        <tr><th>ID</th><th>Name</th><th>Code</th><th>Actions</th></tr>
      </thead>
      <tbody id="deptTableBody">
        <!-- rows injected by JS -->
      </tbody>
    </table>

  </div>

  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/departments.js"></script>
</body>
</html>
