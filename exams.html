<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UMS - Exams & Grades</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <div class="content-inner">
<div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>

    <form id="sectionFilterForm" class="inline-form">
      <div>
        <label for="sectionSelect">Section</label>
        <select id="sectionSelect" required></select>
      </div>
      <button type="submit" style="width:auto; padding:0.6rem 1rem;">Load Exams</button>
    </form>

    <form id="addExamForm" class="inline-form" style="flex-wrap: wrap;">
      <div>
        <label for="newExamType">Type</label>
        <select id="newExamType" required>
          <option value="quiz">Quiz</option>
          <option value="assignment">Assignment</option>
          <option value="midterm">Midterm</option>
          <option value="final">Final</option>
        </select>
      </div>
      <div>
        <label for="newExamTitle">Title</label>
        <input type="text" id="newExamTitle" placeholder="e.g. Midterm Exam" required />
      </div>
      <div>
        <label for="newExamDate">Date</label>
        <input type="date" id="newExamDate" required />
      </div>
      <div>
        <label for="newExamTotal">Total Marks</label>
        <input type="number" id="newExamTotal" min="1" max="1000" step="0.5" required style="width:90px;" />
      </div>
      <button type="submit" style="width:auto; padding:0.6rem 1rem;">Add Exam</button>
    </form>

    <table id="examTable">
      <thead>
        <tr><th>Type</th><th>Title</th><th>Date</th><th>Total</th><th>Actions</th></tr>
      </thead>
      <tbody id="examTableBody"></tbody>
    </table>

    <div id="rosterSection" style="display:none; margin-top:1.5rem; border-top:1px solid #eee; padding-top:1rem;">
      <h1 id="rosterTitle" style="font-size:1.05rem;"></h1>
      <table id="rosterTable">
        <thead><tr><th>Student</th><th>Marks</th><th>Entry</th></tr></thead>
        <tbody id="rosterTableBody"></tbody>
      </table>
    </div>

  </div>

  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/exams.js"></script>
</body>
</html>
