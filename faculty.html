<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UMS - Faculty Profiles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <div class="content-inner">
<div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>

    <form id="addForm" class="inline-form">
      <div>
        <label for="newUser">Faculty User</label>
        <select id="newUser" required></select>
      </div>
      <div>
        <label for="newDesignation">Designation</label>
        <input type="text" id="newDesignation" placeholder="e.g. Assistant Professor" required />
      </div>
      <div>
        <label for="newDept">Department</label>
        <select id="newDept" required></select>
      </div>
      <button type="submit" style="width:auto; padding:0.6rem 1rem;">Add</button>
    </form>
    <p style="font-size:0.8rem; color:#666;">
      Only users already registered with the "faculty" role and without an existing profile appear here.
      Create the user first on the <a href="register.html">Create User</a> page if they're missing.
    </p>

    <table id="facultyTable">
      <thead>
        <tr><th>ID</th><th>Name</th><th>Email</th><th>Designation</th><th>Department</th><th>Actions</th></tr>
      </thead>
      <tbody id="facultyTableBody"></tbody>
    </table>

  </div>

  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/faculty.js"></script>
</body>
</html>
