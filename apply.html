<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UniversityOS — Apply for Admission</title><link rel="stylesheet" href="css/theme.css"></head><body><main style="max-width:900px;margin:auto;padding:30px 16px"><div class="page-card"><div class="brand" style="padding:0 0 22px"><div class="brand-mark">U</div><div><strong style="color:#102a43">UniversityOS</strong><span style="color:#667085">Admissions Portal</span></div></div><div class="section-title"><h2>Apply for Admission</h2><span>Start your application online</span></div><div id="msg" style="display:none"></div><form id="applyForm" class="form-grid"><div class="form-field wide"><label>Applicant name</label><input id="applicantName" required></div><div class="form-field"><label>Email</label><input id="email" type="email" required></div><div class="form-field"><label>Phone</label><input id="phone"></div><div class="form-field wide"><label>Program</label><select id="programId" required></select></div><div class="form-field"><label>Previous institution</label><input id="previousInstitution"></div><div class="form-field full"><button class="btn">Submit Application</button></div></form><p style="font-size:11px;color:#667085;margin-top:15px">After submission, keep your application number for future communication.</p></div></main><script src="js/api.js"></script><script>
const msg=(t,c='success')=>{const e=document.getElementById('msg');e.className='alert '+c;e.textContent=t;e.style.display='block'};
(async()=>{try{const r=await getPublicPrograms();document.getElementById('programId').innerHTML=r.data.map(p=>`<option value="${p.id}">${p.name} — ${p.degree_level} (${p.duration_years} years)</option>`).join('')}catch(e){msg(e.message,'error')}})();
document.getElementById('applyForm').onsubmit=async e=>{e.preventDefault();try{const r=await createPublicApplication({applicantName:applicantName.value,email:email.value,phone:phone.value,programId:programId.value,previousInstitution:previousInstitution.value});msg(`Application submitted successfully. Your application number is ${r.data.applicationNo}.`);e.target.reset()}catch(e){msg(e.message,'error')}};
</script></body></html>
