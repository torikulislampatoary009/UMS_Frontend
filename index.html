<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>University Management System — Sign In</title><link rel="stylesheet" href="css/style.css"></head>
<body><main class="card auth-card">
<div class="auth-brand">UNIVERSITY MANAGEMENT SYSTEM<span>Academic • Finance • Administration</span></div>
<h1>Sign in</h1><p class="auth-sub">Use your institutional account to continue.</p>
<div class="error" id="errorMsg"></div><div class="success" id="successMsg"></div>
<form id="loginForm"><label for="email">Institutional email</label><input type="email" id="email" autocomplete="username" required>
<label for="password">Password</label><input type="password" id="password" autocomplete="current-password" required>
<button type="submit" id="loginBtn">Sign In</button></form>
<div class="auth-links"><a href="forgot-password.html">Forgot password?</a><span>•</span><a href="register.html">Admin: Create user</a></div>
</main><script src="js/api.js"></script><script src="js/login.js"></script></body></html>
