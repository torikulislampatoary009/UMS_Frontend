<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UMS - Enrollments</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="card card-wide">
    <nav class="topnav">
      <a href="login.html">Login</a>
      <a href="register.html">Create User</a>
      <a href="departments.html">Departments</a>
      <a href="programs.html">Programs</a>
      <a href="courses.html">Courses</a>
      <a href="faculty.html">Faculty</a>
      <a href="students.html">Students</a>
      <a href="semesters.html">Semesters</a>
      <a href="sections.html">Sections</a>
      <a href="enrollments.html">Enrollments</a>
    </nav>

    <h1>Enrollments</h1>
    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>

    <form id="addForm" class="inline-form">
      <div>
        <label for="newStudent">Student</label>
        <select id="newStudent" required></select>
      </div>
      <div>
        <label for="newSection">Section</label>
        <select id="newSection" required></select>
      </div>
      <button type="submit" style="width:auto; padding:0.6rem 1rem;">Enroll</button>
    </form>

    <table id="enrollmentTable">
      <thead>
        <tr><th>ID</th><th>Student</th><th>Course</th><th>Section</th><th>Semester</th><th>Status</th><th>Actions</th></tr>
      </thead>
      <tbody id="enrollmentTableBody"></tbody>
    </table>
  </div>

  <script src="js/api.js"></script>
  <script src="js/enrollments.js"></script>
</body>
</html>
