<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UMS - Programs</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="card card-wide">
    <nav class="topnav">
      <a href="login.html">Login</a>
      <a href="register.html">Create User</a>
      <a href="departments.html">Departments</a>
      <a href="programs.html">Programs</a>
      <a href="courses.html">Courses</a>
    </nav>

    <h1>Programs</h1>
    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>

    <form id="addForm" class="inline-form">
      <div>
        <label for="newName">Name</label>
        <input type="text" id="newName" required />
      </div>
      <div>
        <label for="newDegree">Degree Level</label>
        <select id="newDegree" required>
          <option value="undergraduate">Undergraduate</option>
          <option value="graduate">Graduate</option>
          <option value="doctorate">Doctorate</option>
        </select>
      </div>
      <div>
        <label for="newDuration">Years</label>
        <input type="number" id="newDuration" min="1" max="10" required />
      </div>
      <div>
        <label for="newDept">Department</label>
        <select id="newDept" required></select>
      </div>
      <button type="submit" style="width:auto; padding:0.6rem 1rem;">Add</button>
    </form>

    <table id="progTable">
      <thead>
        <tr><th>ID</th><th>Name</th><th>Degree</th><th>Years</th><th>Department</th><th>Actions</th></tr>
      </thead>
      <tbody id="progTableBody"></tbody>
    </table>
  </div>

  <script src="js/api.js"></script>
  <script src="js/programs.js"></script>
</body>
</html>
